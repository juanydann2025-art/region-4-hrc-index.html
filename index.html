<!DOCTYPE html>

<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sistema de Campaña | Región 4</title>

<link
  rel="stylesheet"
  href="css/estilos.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="login">

  <!-- ========================================= -->

  <!-- ENCABEZADO -->

  <!-- ========================================= -->

  <div class="logo">


<div class="logo-imagen">

  <img
    src="img/logo.png"
    alt="Logo">

</div>

<h1>
  Sistema de Campaña
</h1>

<div class="region">
  Región 4
</div>

<p>
  Responsable
  <strong>
    Horacio Schiavon Reyes
  </strong>
</p>


  </div>

  <!-- ========================================= -->

  <!-- FORMULARIO -->

  <!-- ========================================= -->

  <div class="formulario-login">


<div class="bienvenida">

  <h2>
    Bienvenido
  </h2>

  <span>
    Ingresa tus datos para continuar
  </span>

</div>


<!-- USUARIO -->

<div class="grupo">

  <label for="usuario">
    Usuario
  </label>

  <div class="input">

    <i class="fa-solid fa-user"></i>

    <input
      type="text"
      id="usuario"
      placeholder="Escribe tu usuario"
      autocomplete="username">

  </div>

</div>


<!-- CONTRASEÑA -->

<div class="grupo">

  <label for="password">
    Contraseña
  </label>

  <div class="input">

    <i class="fa-solid fa-lock"></i>

    <input
      type="password"
      id="password"
      placeholder="Escribe tu contraseña"
      autocomplete="current-password">

    <button
      type="button"
      id="ver"
      aria-label="Mostrar contraseña">

      <i class="fa-solid fa-eye"></i>

    </button>

  </div>

</div>


<!-- BOTÓN -->

<button
  type="button"
  id="login">

  <span>
    Iniciar Sesión
  </span>

  <i class="fa-solid fa-arrow-right"></i>

</button>


<!-- MENSAJE -->

<div
  id="mensaje"
  class="mensaje-login">
</div>


  </div>

  <!-- ========================================= -->

  <!-- PIE -->

  <!-- ========================================= -->

  <div class="login-footer">


<i class="fa-solid fa-shield-halved"></i>

Acceso exclusivo al sistema


  </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
