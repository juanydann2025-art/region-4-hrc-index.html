<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Administrar Usuarios</title>

<link rel="stylesheet"
      href="css/usuarios.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>


<body>


<div class="formulario">


<!-- ========================================
     ENCABEZADO
======================================== -->

<h1>

<i class="fa-solid fa-user-gear"></i>

Administrar Usuarios

</h1>



<!-- ========================================
     BOTÓN REGRESAR
======================================== -->

<button
type="button"
class="boton regresar"
onclick="regresarMenu()">

<i class="fa-solid fa-arrow-left"></i>

Regresar al menú

</button>



<!-- ========================================
     INFORMACIÓN DEL ADMINISTRADOR
======================================== -->

<div class="encabezado">

<div>

<strong>Usuario:</strong>

<span id="nombreUsuario">
Cargando...
</span>

</div>


<div>

<strong>Rol:</strong>

<span id="rolUsuario">
Cargando...
</span>

</div>

</div>



<!-- ========================================
     FORMULARIO NUEVO USUARIO
======================================== -->

<h2>

<i class="fa-solid fa-user-plus"></i>

Registrar usuario

</h2>



<form id="formUsuario">


<!-- ========================================
     ID
======================================== -->

<div class="campo">

<label for="idUsuario">

ID

</label>

<input
type="text"
id="idUsuario"
name="idUsuario"
readonly
placeholder="Generando...">

</div>



<!-- ========================================
     NOMBRE
======================================== -->

<div class="campo">

<label for="nombre">

Nombre completo

</label>

<input
type="text"
id="nombre"
name="nombre"
placeholder="Nombre completo"
required>

</div>



<!-- ========================================
     USUARIO
======================================== -->

<div class="campo">

<label for="usuario">

Usuario

</label>

<input
type="text"
id="usuario"
name="usuario"
placeholder="Usuario para iniciar sesión"
required>

</div>



<!-- ========================================
     PASSWORD
======================================== -->

<div class="campo">

<label for="password">

Contraseña

</label>

<input
type="password"
id="password"
name="password"
placeholder="Contraseña"
required>

</div>



<!-- ========================================
     ROL
======================================== -->

<div class="campo">

<label for="rol">

Rol

</label>

<select
id="rol"
name="rol"
required>

<option value="">
Seleccione un rol
</option>

<option value="Administrador">
Administrador
</option>

<option value="Coordinador">
Coordinador
</option>

<option value="Brigadista">
Brigadista
</option>

</select>

</div>



<!-- ========================================
     ACTIVO
======================================== -->

<div class="campo">

<label for="activo">

Activo

</label>

<select
id="activo"
name="activo"
required>

<option value="SI">
Sí
</option>

<option value="NO">
No
</option>

</select>

</div>



<!-- ========================================
     DIRECCIÓN
======================================== -->

<div class="campo">

<label for="direccion">

Dirección

</label>

<input
type="text"
id="direccion"
name="direccion"
placeholder="Calle, número, colonia, etc."
required>

</div>



<!-- ========================================
     TELÉFONO
======================================== -->

<div class="campo">

<label for="telefono">

Número telefónico

</label>

<input
type="tel"
id="telefono"
name="telefono"
placeholder="Número telefónico"
maxlength="15"
required>

</div>



<!-- ========================================
     BOTONES FORMULARIO
======================================== -->

<div class="botones">


<button
type="submit"
class="boton guardar">

<i class="fa-solid fa-floppy-disk"></i>

Guardar usuario

</button>


<button
type="button"
class="boton limpiar"
onclick="limpiarFormulario()">

<i class="fa-solid fa-eraser"></i>

Limpiar

</button>


</div>


</form>



<hr>



<!-- ========================================
     LISTADO DE USUARIOS
======================================== -->

<h2>

<i class="fa-solid fa-users"></i>

Usuarios registrados

</h2>



<!-- ========================================
     BUSCAR
======================================== -->

<div class="busqueda">

<input
type="text"
id="buscarUsuario"
placeholder="Buscar por nombre o usuario..."
oninput="filtrarUsuarios()">

<i class="fa-solid fa-magnifying-glass"></i>

</div>



<!-- ========================================
     TABLA
======================================== -->

<div class="tabla-contenedor">


<table>


<thead>

<tr>

<th>
ID
</th>

<th>
Nombre
</th>

<th>
Usuario
</th>

<th>
Rol
</th>

<th>
Activo
</th>

<th>
Dirección
</th>

<th>
Teléfono
</th>

<th>
Acciones
</th>

</tr>

</thead>


<tbody
id="tablaUsuarios">

<tr>

<td colspan="8">

Cargando usuarios...

</td>

</tr>

</tbody>


</table>


</div>



<!-- ========================================
     MENSAJE
======================================== -->

<div
id="mensaje">

</div>



<!-- ========================================
     BOTÓN REGRESAR
======================================== -->

<div class="botones">


<button
type="button"
class="boton regresar"
onclick="regresarMenu()">

<i class="fa-solid fa-arrow-left"></i>

Regresar al menú

</button>


</div>


</div>



<script src="js/usuarios.js"></script>


</body>

</html>
