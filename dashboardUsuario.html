<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard por Usuario</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    font-family:"Segoe UI",Arial,sans-serif;
    color:#333;
}

.contenedor{
    width:96%;
    max-width:1500px;
    margin:25px auto;
}

/* =====================================================
   CABECERA
===================================================== */

.cabecera{
    background:linear-gradient(135deg,#991b1b,#dc2626);
    color:white;
    padding:22px 28px;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 8px 25px rgba(0,0,0,.15);
    margin-bottom:20px;
}

.titulo{
    display:flex;
    align-items:center;
    gap:15px;
}

.icono-titulo{
    width:55px;
    height:55px;
    border-radius:14px;
    background:rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
}

.titulo h1{
    margin:0;
    font-size:25px;
    font-weight:800;
}

.titulo p{
    margin:5px 0 0;
    font-size:13px;
    opacity:.9;
}

.botones{
    display:flex;
    gap:10px;
}

.btn{
    border:none;
    padding:11px 17px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.regresar{
    background:#7f1d1d;
    color:white;
}

/* =====================================================
   BUSCADOR
===================================================== */

.panel-busqueda{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;

    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.panel-busqueda h2{
    margin:0 0 15px;
    color:#7f1d1d;
    font-size:20px;
}

.busqueda{
    display:flex;
    gap:10px;
}

.input-busqueda{
    flex:1;

    border:1px solid #ddd;
    border-radius:10px;

    padding:13px 15px;

    font-size:15px;
    outline:none;
}

.input-busqueda:focus{
    border-color:#b91c1c;
    box-shadow:0 0 0 3px #fee2e2;
}

.btn-buscar{
    border:none;
    border-radius:10px;

    padding:0 22px;

    background:#b91c1c;
    color:white;

    font-weight:700;
    cursor:pointer;
}

.contador{
    margin-top:12px;
    color:#777;
    font-size:13px;
    font-weight:600;
}

/* =====================================================
   PANEL TABLA
===================================================== */

.panel{
    background:white;
    border-radius:16px;
    padding:22px;

    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.panel-titulo{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;

    border-bottom:1px solid #eee;
    padding-bottom:15px;
}

.panel-titulo h2{
    margin:0;
    color:#7f1d1d;
    font-size:21px;
    font-weight:800;
}

.panel-titulo p{
    margin:5px 0 0;
    color:#777;
    font-size:13px;
}

.tabla-contenedor{
    width:100%;
    overflow-x:auto;

    border-radius:12px;
    border:1px solid #eee;
}

.tabla{
    width:100%;
    border-collapse:collapse;

    min-width:1050px;

    font-size:14px;
}

.tabla thead{
    background:linear-gradient(
        135deg,
        #991b1b,
        #b91c1c
    );

    color:white;
}

.tabla th{
    padding:15px 12px;

    text-align:center;

    font-size:12px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.4px;

    white-space:nowrap;
}

.tabla td{
    padding:13px 12px;

    text-align:center;

    border-bottom:1px solid #eee;

    color:#3f3f46;
    font-weight:600;
}

.tabla tbody tr{
    transition:.15s;
}

.tabla tbody tr:hover{
    background:#fff7f7;
}

/* =====================================================
   USUARIO
===================================================== */

.usuario-login{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 10px;

    border-radius:8px;

    background:#fff1f2;
    color:#991b1b;

    font-weight:800;
}

.usuario-nombre{
    text-align:left !important;
    font-weight:700 !important;
}

/* =====================================================
   META
===================================================== */

.meta{
    font-weight:900 !important;
    color:#7f1d1d !important;
}

.meta-pequena{
    display:block;
    font-size:10px;
    color:#999;
    font-weight:600;
}

/* =====================================================
   REGISTROS
===================================================== */

.registros{
    font-weight:900 !important;
    color:#27272a !important;
}

/* =====================================================
   AVANCE
===================================================== */

.porcentaje{
    min-width:160px;
}

.porcentaje-numero{
    display:block;

    font-size:13px;
    font-weight:900;

    color:#991b1b;

    margin-bottom:6px;
}

.barra{
    width:100%;
    height:8px;

    background:#ececec;

    border-radius:20px;

    overflow:hidden;
}

.barra-interior{
    height:100%;

    background:linear-gradient(
        90deg,
        #991b1b,
        #ef4444
    );

    border-radius:20px;

    transition:width .6s ease;
}

/* =====================================================
   VOTARON
===================================================== */

.votaron{
    color:#166534 !important;
    font-weight:900 !important;
}

/* =====================================================
   PENDIENTES
===================================================== */

.pendientes{
    color:#b45309 !important;
    font-weight:900 !important;
}

/* =====================================================
   ESTADO
===================================================== */

.estado{
    font-weight:800;
}

.estado-ok{
    color:#166534;
}

.estado-atrasado{
    color:#b91c1c;
}

.registro-atrasado{
    background:#fff8f8;
}

/* =====================================================
   CARGANDO
===================================================== */

.cargando{
    padding:50px 20px !important;
    text-align:center !important;

    color:#777 !important;

    font-size:15px;
}

.cargando i{
    color:#b91c1c;

    font-size:25px;

    margin-right:8px;
}

/* =====================================================
   MENSAJE
===================================================== */

#mensaje{
    margin-top:15px;

    text-align:center;

    color:#777;

    font-size:13px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    .cabecera{
        flex-direction:column;
        align-items:stretch;
        gap:15px;
    }

    .botones{
        width:100%;
    }

    .btn{
        flex:1;
    }

    .busqueda{
        flex-direction:column;
    }

    .btn-buscar{
        padding:13px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<!-- =====================================================
     CABECERA
===================================================== -->

<header class="cabecera">

    <div class="titulo">

        <div class="icono-titulo">

            <i class="fa-solid fa-users"></i>

        </div>

        <div>

            <h1>
                Dashboard por Usuario
            </h1>

            <p id="usuarioEstadistica">
                Cargando usuario...
            </p>

        </div>

    </div>


    <div class="botones">

        <button
            class="btn regresar"
            onclick="regresarMenu()">

            <i class="fa-solid fa-arrow-left"></i>

            Menú

        </button>

    </div>

</header>


<!-- =====================================================
     BUSCADOR
===================================================== -->

<section class="panel-busqueda">

    <h2>

        <i class="fa-solid fa-magnifying-glass"></i>

        Buscar usuario

    </h2>


    <div class="busqueda">

        <input
            type="text"
            id="buscarUsuario"
            class="input-busqueda"
            placeholder="Escribe nombre o usuario..."
            autocomplete="off">


        <button
            class="btn-buscar"
            onclick="buscarUsuario()">

            <i class="fa-solid fa-search"></i>

            Buscar

        </button>

    </div>


    <div
        id="contadorUsuarios"
        class="contador">

        Cargando usuarios...

    </div>

</section>


<!-- =====================================================
     TABLA
===================================================== -->

<section class="panel">

    <div class="panel-titulo">

        <div>

            <h2>

                <i class="fa-solid fa-table"></i>

                Avance por usuario

            </h2>

            <p>

                Meta de 90 registros por usuario

            </p>

        </div>

    </div>


    <div class="tabla-contenedor">

        <table class="tabla">

            <thead>

                <tr>

                    <th>
                        Usuario
                    </th>

                    <th>
                        Nombre
                    </th>

                    <th>
                        Meta
                    </th>

                    <th>
                        Registrados
                    </th>

                    <th>
                        Avance
                    </th>

                    <th>
                        Votaron
                    </th>

                    <th>
                        Pendientes por votar
                    </th>

                    <th>
                        Último registro
                    </th>

                </tr>

            </thead>


            <tbody id="tablaUsuarios">

                <tr>

                    <td
                        colspan="8"
                        class="cargando">

                        <i
                            class="fa-solid fa-spinner fa-spin">
                        </i>

                        Cargando usuarios...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>


<div id="mensaje"></div>

</div>


<script src="js/dashboardUsuario.js"></script>

</body>

</html>
