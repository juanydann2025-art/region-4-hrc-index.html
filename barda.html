<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Bardas por Encalar</title>

<link rel="stylesheet"
      href="css/peti.css">

</head>


<body>


<div class="formulario">


<h1>

<i class="fa-solid fa-paint-roller"></i>

Bardas por Encalar

</h1>


<!-- ================================= -->
<!-- SECCIÓN Y COMUNIDAD -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Sección
</label>


<select id="seccion">

<option value="">
Seleccione sección
</option>

<option value="4953">4953</option>
<option value="4954">4954</option>
<option value="4955">4955</option>
<option value="4962">4962</option>
<option value="5025">5025</option>
<option value="5026">5026</option>
<option value="5027">5027</option>
<option value="5034">5034</option>
<option value="5035">5035</option>
<option value="5036">5036</option>
<option value="5049">5049</option>
<option value="5050">5050</option>
<option value="5066">5066</option>
<option value="5067">5067</option>
<option value="5068">5068</option>
<option value="5069">5069</option>
<option value="5070">5070</option>
<option value="5071">5071</option>
<option value="5072">5072</option>
<option value="5073">5073</option>
<option value="5074">5074</option>
<option value="5075">5075</option>
<option value="5076">5076</option>
<option value="5077">5077</option>
<option value="5078">5078</option>
<option value="5079">5079</option>
<option value="5080">5080</option>

</select>

</div>



<div class="campo">

<label>
Comunidad
</label>


<select id="comunidad">

<option value="">
Seleccione comunidad
</option>

</select>

</div>


</div>


<!-- ================================= -->
<!-- CALLE Y NÚMERO -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Calle
</label>


<input
type="text"
id="calle"
placeholder="Nombre de la calle">

</div>



<div class="campo">

<label>
Número
</label>


<input
type="text"
id="numero"
placeholder="Número">

</div>


</div>


<!-- ================================= -->
<!-- ALTO Y ANCHO -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Alto en mts
</label>


<input
type="number"
id="alto"
step="0.01"
min="0"
placeholder="Ej. 2.50">

</div>



<div class="campo">

<label>
Ancho en mts
</label>


<input
type="number"
id="ancho"
step="0.01"
min="0"
placeholder="Ej. 5.00">

</div>


</div>


<!-- ================================= -->
<!-- QUIÉN AUTORIZA -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Quién autoriza
</label>


<input
type="text"
id="autoriza"
placeholder="Nombre de quien autoriza">

</div>


</div>


<!-- ================================= -->
<!-- METROS CUADRADOS -->
<!-- ================================= -->

<div class="campo">

<label>
Área total de la barda (m²)
</label>


<input
type="text"
id="metros"
readonly
placeholder="Se calculará automáticamente">

</div>


<!-- ================================= -->
<!-- FOTOGRAFÍA -->
<!-- ================================= -->

<div class="foto">


<label>
Fotografía de la barda
</label>


<input
type="file"
accept="image/*"
capture="environment"
id="fotoBarda">


<img
id="vistaBarda"
alt="Vista previa">

</div>


<!-- ================================= -->
<!-- BOTÓN -->
<!-- ================================= -->

<button
type="button"
class="boton"
onclick="guardarBarda()">

Guardar Solicitud

</button>


</div>


<script src="js/bardas.js"></script>


</body>

</html>
