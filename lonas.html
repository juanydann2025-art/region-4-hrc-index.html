<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Solicitud de Lonas</title>

<link rel="stylesheet"
      href="css/lona.css">

</head>


<body>


<div class="formulario">


<h1>

<i class="fa-solid fa-flag"></i>

Solicitud de Lonas

</h1>


<!-- ================================= -->
<!-- SECCIÓN Y COMUNIDAD -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Sección
</label>


<select id="seccion">

<option value="">
Seleccione sección
</option>

<option value="4953">4953</option>
<option value="4954">4954</option>
<option value="4955">4955</option>
<option value="4962">4962</option>
<option value="5025">5025</option>
<option value="5026">5026</option>
<option value="5027">5027</option>
<option value="5034">5034</option>
<option value="5035">5035</option>
<option value="5036">5036</option>
<option value="5049">5049</option>
<option value="5050">5050</option>
<option value="5066">5066</option>
<option value="5067">5067</option>
<option value="5068">5068</option>
<option value="5069">5069</option>
<option value="5070">5070</option>
<option value="5071">5071</option>
<option value="5072">5072</option>
<option value="5073">5073</option>
<option value="5074">5074</option>
<option value="5075">5075</option>
<option value="5076">5076</option>
<option value="5077">5077</option>
<option value="5078">5078</option>
<option value="5079">5079</option>
<option value="5080">5080</option>

</select>

</div>



<div class="campo">

<label>
Comunidad
</label>


<select id="comunidad">

<option value="">
Seleccione comunidad
</option>

</select>

</div>


</div>


<!-- ================================= -->
<!-- CALLE Y NÚMERO -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Calle
</label>


<input
type="text"
id="calle">

</div>



<div class="campo">

<label>
Número
</label>


<input
type="text"
id="numero">

</div>


</div>


<!-- ================================= -->
<!-- TIPO DE LONA Y AUTORIZACIÓN -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Tipo de lona
</label>


<select id="tipoLona">

<option value="">
Seleccione tamaño
</option>

<option value="Chica">
Chica
</option>

<option value="Mediana">
Mediana
</option>

<option value="Grande">
Grande
</option>

</select>

</div>



<div class="campo">

<label>
Autoriza colocación
</label>

<input
  type="text"
  id="autoriza"
  placeholder="Escriba el nombre de quien autoriza">

</div>


</div>


<!-- ================================= -->
<!-- FOTOGRAFÍA -->
<!-- ================================= -->

<div class="foto">


<label>
Fotografía del lugar
</label>


<input
type="file"
accept="image/*"
capture="environment"
id="fotoLona">


<img
id="vistaLona"
alt="Vista previa">

</div>


<!-- ================================= -->
<!-- BOTÓN -->
<!-- ================================= -->

<button
type="button"
class="boton"
onclick="guardarLona()">

Guardar Solicitud

</button>


</div>


<script src="js/lonas.js"></script>


</body>

</html>
