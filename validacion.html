<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Validación de Registros</title>

<link rel="stylesheet"
      href="css/validacion.css">

</head>


<body>


<div class="contenedor">


    <!-- ===================================================== -->
    <!-- ENCABEZADO -->
    <!-- ===================================================== -->

    <div class="encabezado">

        <div>

            <h1>
                Validación de Registros
            </h1>

            <p>
                Revise y valide los registros pendientes.
            </p>

        </div>


        <button
            id="btnActualizar"
            class="btn-actualizar">

            🔄 Actualizar

        </button>

    </div>


    <!-- ===================================================== -->
    <!-- BUSCADOR -->
    <!-- ===================================================== -->

    <div class="panel-busqueda">

        <div class="campo-busqueda">

            <label for="buscarRegistro">
                Buscar registro
            </label>

            <input
                type="text"
                id="buscarRegistro"
                placeholder="Folio, nombre, usuario, sección, comunidad..."
                autocomplete="off">

        </div>


        <div class="campo-filtro">

            <label for="filtroCategoria">
                Categoría
            </label>

            <select id="filtroCategoria">

                <option value="">
                    Todas
                </option>

                <option value="Ciudadanos">
                    Ciudadanos
                </option>

                <option value="Peticiones">
                    Peticiones
                </option>

                <option value="Operaciones">
                    Operaciones
                </option>

                <option value="Bardas">
                    Bardas
                </option>

                <option value="Reuniones">
                    Reuniones
                </option>

            </select>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- MENSAJES -->
    <!-- ===================================================== -->

    <div
        id="mensaje"
        class="mensaje oculto">
    </div>


    <!-- ===================================================== -->
    <!-- CONTADORES -->
    <!-- ===================================================== -->

    <div class="resumen">

        <div class="tarjeta">

            <span>
                Registros pendientes
            </span>

            <strong id="totalPendientes">
                0
            </strong>

        </div>


        <div class="tarjeta">

            <span>
                Total de duplicados
            </span>

            <strong id="totalDuplicados">
                0
            </strong>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- TABLA -->
    <!-- ===================================================== -->

    <div class="tabla-contenedor">

        <table id="tablaRegistros">

            <thead>

                <tr>

                    <th>Folio</th>

                    <th>Categoría</th>

                    <th>Fecha registro</th>

                    <th>Usuario que generó</th>

                    <th>Nombre</th>

                    <th>Sección</th>

                    <th>Comunidad</th>

                    <th>Duplicado</th>

                    <th>Duplicado con usuario</th>

                    <th>Comentarios</th>

                    <th>Acción</th>

                </tr>

            </thead>


            <tbody id="cuerpoTabla">

            </tbody>

        </table>

    </div>


</div>


<!-- ========================================================= -->
<!-- MODAL -->
<!-- ========================================================= -->

<div
    id="modalValidacion"
    class="modal oculto">


    <div class="modal-contenido">


        <div class="modal-header">

            <h2>
                Validar registro
            </h2>

            <button
                id="btnCerrarModal"
                class="btn-cerrar">

                ×

            </button>

        </div>


        <!-- ================================================= -->
        <!-- DATOS -->
        <!-- ================================================= -->

        <div
            id="detalleRegistro"
            class="detalle-registro">

        </div>


        <!-- ================================================= -->
        <!-- COMENTARIOS -->
        <!-- ================================================= -->

        <div class="campo-comentario">

            <label for="comentarios">

                Comentarios de validación

            </label>

            <textarea
                id="comentarios"
                rows="5"
                placeholder="Escriba algún comentario sobre este registro..."></textarea>

        </div>


        <!-- ================================================= -->
        <!-- ACCIONES -->
        <!-- ================================================= -->

        <div class="acciones-modal">

            <button
                id="btnCancelar"
                class="btn-secundario">

                Cancelar

            </button>


            <button
                id="btnValidar"
                class="btn-validar">

                ✓ Validar registro

            </button>

        </div>


    </div>

</div>


<script src="js/validacion.js"></script>

</body>

</html>
